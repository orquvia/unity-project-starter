name: Unity Tests

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、実行中のものは止める
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # テスト結果を PR のチェックとして表示するため

jobs:
  test:
    name: ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v7

      # Library を保存して、2回目以降のアセットインポートを短縮する
      - uses: actions/cache@v6
        with:
          path: UnityProject/Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-

      # Unity のバージョンは ProjectVersion.txt から自動で決まる
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts
